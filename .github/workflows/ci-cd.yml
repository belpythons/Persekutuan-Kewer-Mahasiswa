name: CI/CD Infrastructure Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Python Service Tests
        run: |
          cd python-service
          pip install -r requirements.txt
          pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Flask AI Service Image
        uses: docker/build-push-action@v4
        with:
          context: ./python-service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/python-ai-service:latest
            ghcr.io/${{ github.repository }}/python-ai-service:${{ github.sha }}
