name: Supabase Keep-Alive

# Free-tier Supabase projects auto-pause after a week of no API activity.
# This pings a real, lightweight table through PostgREST every 3 days so the
# python-ai-service's Postgres database never goes to sleep.
on:
  schedule:
    - cron: '0 3 */3 * *' # every 3 days, 03:00 UTC
  workflow_dispatch: {} # allow a manual run from the Actions tab to sanity-check secrets

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping weather_daily_logs via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_KEY repository secrets are not set."
            exit 1
          fi

          http_code=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            --max-time 15 \
            "${SUPABASE_URL%/}/rest/v1/weather_daily_logs?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "HTTP status: $http_code"
          cat /tmp/response.json

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Keep-alive request failed with HTTP $http_code"
            exit 1
          fi

          echo "✅ Supabase keep-alive succeeded — project stays active."
