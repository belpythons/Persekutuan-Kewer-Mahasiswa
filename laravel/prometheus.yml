global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'python-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']

  - job_name: 'laravel-web-portal'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8001']
